name: Build Windows x86 DLL

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      CARGO_BUILD_JOBS: 1
      RUST_BACKTRACE: 1
      LOCAL_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKGRS_DYNAMIC: 1
      VCPKGRS_TRIPLET: x86-windows
      VCPKG_DEFAULT_TRIPLET: x86-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:LOCAL_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:LOCAL_VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve vcpkg version
        id: vcpkg_version
        shell: pwsh
        run: |
          $version = "unknown"
          if (Test-Path "$env:LOCAL_VCPKG_ROOT\.git") {
            $version = (git -C $env:LOCAL_VCPKG_ROOT rev-parse HEAD).Trim()
            Write-Host "vcpkg git HEAD: $version"
          } elseif (Test-Path "$env:LOCAL_VCPKG_ROOT\vcpkg.exe") {
            $version = (& "$env:LOCAL_VCPKG_ROOT\vcpkg.exe" version | Select-Object -First 1).Trim()
            Write-Host "vcpkg version: $version"
          } else {
            Write-Host "vcpkg version could not be resolved; using fallback cache key"
          }

          $safeVersion = $version -replace '[^A-Za-z0-9_.-]', '-'
          "version=$safeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCAL_VCPKG_ROOT }}\installed
            ${{ env.LOCAL_VCPKG_ROOT }}\buildtrees
            ${{ env.LOCAL_VCPKG_ROOT }}\packages
          key: vcpkg-opencv4-x86-windows-${{ runner.os }}-${{ steps.vcpkg_version.outputs.version }}-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Install OpenCV
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install "opencv4[world]:x86-windows"

      - name: Configure OpenCV for opencv crate
        shell: pwsh
        run: |
          $prefix = "$env:VCPKG_ROOT\installed\x86-windows"
          $includeCandidates = @(
            "$prefix\include",
            "$prefix\include\opencv4"
          )
          $libDir = "$prefix\lib"
          $binDir = "$prefix\bin"
          $includeDir = $includeCandidates |
            Where-Object { Test-Path "$_\opencv2\core\version.hpp" } |
            Select-Object -First 1

          if (-not $includeDir) {
            Write-Host "Installed include files:"
            Get-ChildItem "$prefix\include" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 120 | ForEach-Object { Write-Host $_.FullName }
            throw "OpenCV version header was not found under $prefix\include"
          }

          $versionHeader = "$includeDir\opencv2\core\version.hpp"

          $worldLib = @(Get-ChildItem $libDir -Filter "opencv_world*.lib" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "d\.lib$" } |
            Select-Object -First 1)[0]

          if (-not $worldLib) {
            Write-Host "Installed import libraries:"
            Get-ChildItem $libDir -Filter "*.lib" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            throw "opencv_world*.lib was not found in $libDir"
          }

          Write-Host "Using OpenCV include dir: $includeDir"
          Write-Host "Using OpenCV lib dir: $libDir"
          Write-Host "Using OpenCV link lib: $($worldLib.BaseName)"
          Write-Host "Available runtime DLLs:"
          Get-ChildItem $binDir -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }

          $opencvIncludePaths = @($includeDir)
          if ($includeDir -ne "$prefix\include") {
            $opencvIncludePaths += "$prefix\include"
          }

          "OPENCV_INCLUDE_PATHS=$($opencvIncludePaths -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_PATHS=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_LIBS=$($worldLib.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_DISABLE_PROBES=pkg_config,cmake,vcpkg_cmake,vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release DLL
        shell: pwsh
        run: |
          cargo build -vv --release --target i686-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\i686-pc-windows-msvc\release\slider_detect.dll" dist\slider_detect.dll
          Copy-Item "target\i686-pc-windows-msvc\release\slider_detect.dll" dist\SliderDetect.dll
          Copy-Item README.md dist\README.md

          $vcpkgBin = "$env:VCPKG_ROOT\installed\x86-windows\bin"
          $runtimeDlls = Get-ChildItem $vcpkgBin -Filter "*.dll" -ErrorAction SilentlyContinue
          foreach ($dll in $runtimeDlls) {
            Copy-Item $dll.FullName dist\
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SliderDetect-windows-x86
          path: dist/**
